<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>旅の小径 青島カメラテスト</title>
<style>
body {
  font-family: sans-serif;
  text-align: center;
  background: #f5f1e8;
  padding: 15px;
}
img, video {
  display: block;
  width: 90%;
  max-width: 400px;
  margin: 15px auto;
}
video { background: #222; }
button { padding: 12px; font-size: 16px; }
</style>
</head>
<body>
<h2>旅の小径 青島テスト</h2>
<p>青島の背景画</p>
<img src="aoshima_ar_target.png"
 onload="document.getElementById('imageStatus').textContent='画像表示成功'"
 onerror="document.getElementById('imageStatus').textContent='画像読み込み失敗'">
<p id="imageStatus">画像読み込み中</p>
<p>カメラ映像</p>
<video id="camera" autoplay muted playsinline></video>
<button id="start">カメラ起動</button>
<button id="stop">停止</button>
<p id="status">カメラ待機中</p>
<script>
const video = document.getElementById("camera");
const status = document.getElementById("status");
let stream = null;

document.getElementById("start").onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: "environment" } }
    });
    video.srcObject = stream;
    await video.play();
    status.textContent = "カメラ起動成功";
  } catch (e) {
    status.textContent = "エラー：" + e.name;
  }
};

document.getElementById("stop").onclick = () => {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  video.srcObject = null;
  status.textContent = "カメラ停止";
};
</script>
</body>
</html>
